<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel IT Command Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card { background-color: #161b22; border: 1px solid #30363d; }
        .badge-custom { font-size: 0.85rem; padding: 0.4em 0.7em; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary mb-4" style="background-color: #161b22;">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-primary" href="/"><i class="bi bi-shield-lock-fill me-2"></i>Grand Luxury Resort - NetOps Portal</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-light px-3" href="/"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                <a class="nav-link text-light px-3" href="/departments"><i class="bi bi-building me-1"></i> Departments</a>
            </div>
        </div>
    </nav>
    <div class="container-fluid px-4">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
